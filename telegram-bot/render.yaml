services:
  - type: web
    name: telegram-bot
    runtime: python
    pythonVersion: "3.12.10"
    region:   oregon          # change to: frankfurt, singapore, ohio, virginia
    plan: free              # upgrade to starter for always-on (no spin-down)
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    # Render injects PORT automatically; no need to set it here.
    envVars:
      - key: BOT_TOKEN
        sync: false         # set via Render dashboard → Environment → Secret files

      - key: WEBHOOK_URL
        # Render provides your service URL automatically.
        # Set this to:  https://<your-service-name>.onrender.com
        sync: false

      - key: ADMIN_IDS
        # Comma-separated Telegram user IDs of bot admins
        # e.g.  123456789,987654321
        sync: false

      - key: AUTO_REPLY_ENABLED
        value: "true"

      - key: AUTO_REPLY_TEXT
        value: "👋 Thanks for your message! A team member will get back to you soon."

      - key: WELCOME_ENABLED
        value: "true"

      - key: WELCOME_TEXT
        value: "👋 Welcome to {group_name}, {first_name}! Glad you're here.\n\nPlease read the group rules before posting. Enjoy your stay! 🎉"

    disk:
      name: bot-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1             # free-tier disk for persistent keyword/warn storage
